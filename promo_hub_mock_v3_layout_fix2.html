<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>チラシ/クーポン 施策一元管理モック v3（レイアウト編集 修正版 / ローカル動作）</title>
  <style>
    :root{
      --bg:#f6f7fb; --panel:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --primary:#2563eb; --primary-weak:#dbeafe;
      --danger:#ef4444; --danger-weak:#fee2e2;
      --ok:#10b981; --ok-weak:#d1fae5;
      --warn:#f59e0b; --warn-weak:#ffedd5;
      --chip:#f3f4f6; --chip-text:#374151;
      --r:16px; --rs:12px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .dark{
      --bg:#0b1220; --panel:#0f172a; --text:#e5e7eb; --muted:#9ca3af; --border:#1f2937;
      --shadow: 0 12px 40px rgba(0,0,0,.45);
      --chip:#111827; --chip-text:#d1d5db;
      --primary-weak: rgba(37,99,235,.18);
      --danger-weak: rgba(239,68,68,.18);
      --ok-weak: rgba(16,185,129,.18);
      --warn-weak: rgba(245,158,11,.18);
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.4}
    button,input,select,textarea{font-family:var(--font); color:var(--text)}
    .app{height:100vh; display:grid; grid-template-columns:270px 1fr 450px; gap:14px; padding:14px}
    @media (max-width:1180px){.app{grid-template-columns:270px 1fr}.detail{display:none}}
    .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
    /* sidebar */
    .sidebar{display:flex; flex-direction:column}
    .sidebarHeader{padding:14px 14px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px}
    .brand .title{font-weight:900}
    .brand .subtitle{font-size:12px; color:var(--muted)}
    .sidebarBody{padding:10px; display:flex; flex-direction:column; gap:10px}
    .navItem{padding:10px; border-radius:12px; border:1px solid transparent; display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none}
    .navItem:hover{background:rgba(0,0,0,.03)}
    .dark .navItem:hover{background:rgba(255,255,255,.05)}
    .navItem.active{background:var(--primary-weak); border-color:rgba(37,99,235,.25)}
    .navItem .name{display:flex; align-items:center; gap:10px; font-weight:900}
    .pill{font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
    .sidebarFooter{margin-top:auto; padding:10px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
    .sidebarFooter .inputTiny{flex:1 1 220px}
    /* btn / inputs */
    .btn{border:1px solid var(--border); background:var(--panel); padding:9px 12px; border-radius:12px; cursor:pointer; font-weight:900; font-size:13px; display:inline-flex; gap:8px; align-items:center}
    .btn:hover{transform:translateY(-1px)}
    .btnPrimary{background:var(--primary); color:#fff; border-color:transparent}
    .btnDanger{background:var(--danger); color:#fff; border-color:transparent}
    .btnGhost{background:transparent}
    .btnSmall{padding:7px 10px; border-radius:10px; font-size:12px}
    .search{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:999px; background:rgba(0,0,0,.02); min-width:260px}
    .dark .search{background:rgba(255,255,255,.04)}
    .search input{border:none; outline:none; background:transparent; width:100%; font-size:13px}
    .select,.input,.textarea{border:1px solid var(--border); border-radius:12px; padding:10px; background:rgba(0,0,0,.02); outline:none; font-size:13px; font-weight:800}
    .dark .select,.dark .input,.dark .textarea{background:rgba(255,255,255,.04)}
    .textarea{min-height:90px; resize:vertical; font-weight:700}
    .hint{color:var(--muted); font-size:12px}
    /* main */
    .main{display:flex; flex-direction:column}
    .topbar{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
    .topbarLeft{display:flex; flex-direction:column; gap:2px; min-width:280px}
    .topbarLeft .h{font-size:16px; font-weight:950}
    .topbarLeft .d{font-size:12px; color:var(--muted)}
    .topbarRight{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end}
    .toolbar{padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
    .filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .tableWrap{padding:10px 14px 14px; overflow:auto; height:100%}
    table{width:100%; border-collapse:separate; border-spacing:0; min-width:980px}
    thead th{position:sticky; top:0; background:var(--panel); z-index:1; text-align:left; font-size:12px; color:var(--muted); padding:10px; border-bottom:1px solid var(--border); white-space:nowrap}
    tbody td{padding:10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top}
    tbody tr{cursor:pointer}
    tbody tr:hover{background:rgba(0,0,0,.02)}
    .dark tbody tr:hover{background:rgba(255,255,255,.04)}
    tbody tr.selected{background:var(--primary-weak)}
    .mono{font-family:var(--mono); font-size:12px; color:var(--muted)}
    .nowrap{white-space:nowrap}
    /* chips/badges/progress */
    .chip{background:var(--chip); color:var(--chip-text); border:1px solid var(--border); border-radius:999px; padding:3px 8px; font-size:12px; font-weight:900}
    .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); font-weight:950; font-size:12px}
    .badge.ok{background:var(--ok-weak); border-color:rgba(16,185,129,.25)}
    .badge.warn{background:var(--warn-weak); border-color:rgba(245,158,11,.25)}
    .badge.danger{background:var(--danger-weak); border-color:rgba(239,68,68,.25)}
    .progress{width:180px; height:10px; border-radius:999px; border:1px solid var(--border); background:rgba(0,0,0,.03); overflow:hidden}
    .dark .progress{background:rgba(255,255,255,.05)}
    .progress>div{height:100%; background:var(--primary); width:0%}
    .progressRow{display:flex; align-items:center; gap:10px}
    .kpiGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
    .kpi{border:1px solid var(--border); border-radius:var(--rs); padding:10px; background:rgba(0,0,0,.02)}
    .dark .kpi{background:rgba(255,255,255,.04)}
    .kpi .k{font-size:12px; color:var(--muted); font-weight:950}
    .kpi .v{font-size:18px; font-weight:950; margin-top:4px}
    /* detail */
    .detail{display:flex; flex-direction:column}
    .detailHeader{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
    .detailTitle{display:flex; flex-direction:column; gap:4px; min-width:0}
    .detailTitle .h{font-weight:950; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .detailTitle .d{font-size:12px; color:var(--muted)}
    .detailBody{padding:12px 14px 14px; overflow:auto; height:100%; display:flex; flex-direction:column; gap:12px}
    .field{display:flex; flex-direction:column; gap:6px}
    .label{font-size:12px; color:var(--muted); font-weight:950}
    .detailActions{display:flex; gap:10px; padding:12px 14px; border-top:1px solid var(--border); flex-wrap:wrap}
    /* modal */
    .modalBack{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:1000}
    .modalBack.show{display:flex}
    .modal{width:min(980px,96vw); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
    .modalHead{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px}
    .modalHead .h{font-weight:950}
    .modalBody{padding:12px 14px 14px; display:flex; flex-direction:column; gap:12px}
    .modalBody textarea{width:100%; min-height:240px; font-family:var(--mono); font-size:12px; line-height:1.5; padding:12px; border-radius:12px; border:1px solid var(--border); background:rgba(0,0,0,.02); outline:none; color:var(--text)}
    .dark .modalBody textarea{background:rgba(255,255,255,.04)}
    .miniHelp{border:1px solid var(--border); border-radius:var(--rs); padding:10px; background:rgba(0,0,0,.02); font-size:12px; color:var(--muted)}
    .dark .miniHelp{background:rgba(255,255,255,.04)}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    @media (max-width:920px){.grid2{grid-template-columns:1fr}}
    .callout{border:1px solid rgba(245,158,11,.35); background:var(--warn-weak); border-radius:14px; padding:10px}

    /* layout editor */
    .layoutTopRow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .layoutViewport{border:1px solid var(--border); border-radius:16px; overflow:auto; background:rgba(0,0,0,.02)}
    .dark .layoutViewport{background:rgba(255,255,255,.04)}
    .layoutStage{position:relative; width:980px; max-width:100%; margin:12px; transform-origin:0 0; touch-action:none}
    .layoutStage.gridOn{
      background-image:
        linear-gradient(to right, rgba(0,0,0,.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,.08) 1px, transparent 1px);
      background-size:40px 40px;
      background-position:0 0;
    }
    .dark .layoutStage.gridOn{
      background-image:
        linear-gradient(to right, rgba(255,255,255,.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.14) 1px, transparent 1px);
    }
    .layoutBg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; opacity:.98}
    .slotLayer{position:absolute; inset:0}
    .slot{position:absolute; border:2px solid rgba(59,130,246,.9); border-radius:10px; background:rgba(59,130,246,.08); cursor:move; user-select:none; touch-action:none}
    .dark .slot{background:rgba(59,130,246,.14)}
    .slot.filled{border-color:rgba(16,185,129,.9); background:rgba(16,185,129,.10)}
    .dark .slot.filled{background:rgba(16,185,129,.16)}
    .slot.locked{opacity:.55; cursor:not-allowed}
    .slot.selected{box-shadow:0 0 0 3px rgba(59,130,246,.25)}
    .slotLabel{position:absolute; left:8px; top:6px; font-size:12px; font-weight:900; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.9); border:1px solid rgba(0,0,0,.08)}
    .dark .slotLabel{background:rgba(0,0,0,.55); border-color:rgba(255,255,255,.12)}
    .slotMeta{position:absolute; right:8px; bottom:6px; font-size:11px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.9); border:1px solid rgba(0,0,0,.08)}
    .dark .slotMeta{background:rgba(0,0,0,.55); border-color:rgba(255,255,255,.12)}
    .handle{position:absolute; width:10px; height:10px; border-radius:4px; background:rgba(255,255,255,.95); border:1px solid rgba(0,0,0,.25)}
    .dark .handle{background:rgba(0,0,0,.75); border-color:rgba(255,255,255,.25)}
    .handle.nw{left:-6px; top:-6px; cursor:nwse-resize}
    .handle.ne{right:-6px; top:-6px; cursor:nesw-resize}
    .handle.sw{left:-6px; bottom:-6px; cursor:nesw-resize}
    .handle.se{right:-6px; bottom:-6px; cursor:nwse-resize}
    .layoutHint{font-size:12px; color:var(--muted); line-height:1.6}
    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:11px; padding:1px 6px; border:1px solid var(--border); border-radius:8px; background:rgba(0,0,0,.02)}
    .dark .kbd{background:rgba(255,255,255,.04)}

  </style>
</head>
<body>
  <div class="app">
    <aside class="card sidebar">
      <div class="sidebarHeader">
        <div class="brand">
          <div class="title">Promotion Hub Mock v2</div>
          <div class="subtitle">一括アップロード＋変更履歴（ローカル）</div>
        </div>
        <button class="btn btnGhost" id="toggleTheme" title="ダーク/ライト切替">🌗</button>
      </div>
      <div class="sidebarBody">
        <div class="hint">ビュー</div>
        <div id="nav"></div>
        <div class="miniHelp">
          <div style="font-weight:950; color:var(--text); margin-bottom:6px;">追加した重要機能</div>
          <div>・BY向け：Excel/スプレッドシートから一括貼り付け→明細を一括登録/更新</div>
          <div>・監査：作成/更新/削除/一括取込の <b>変更履歴ログ</b> を自動保存</div>
          <div>・店向け：<b>公開後に商品が変わった</b> を検知（発注ミス防止の土台）</div>
        </div>
      </div>
      <div class="sidebarFooter">
        <input class="input inputTiny" id="userName" placeholder="あなた（例：BY_佐々木 / 営業企画A）" />
        <button class="btn" id="exportBtn">⬇️ Export</button>
        <button class="btn" id="importBtn">⬆️ Import</button>
        <button class="btn btnDanger" id="resetBtn">🧨 初期化</button>
      </div>
    </aside>

    <main class="card main">
      <div class="topbar">
        <div class="topbarLeft">
          <div class="h" id="viewTitle">—</div>
          <div class="d" id="viewDesc">—</div>
        </div>
        <div class="topbarRight">
          <div class="search">
            🔎 <input id="searchInput" placeholder="検索…（例：バレンタイン / 札幌桑園 / A版 / 2026-02-20 / 490...）" />
          </div>
          <button class="btn" id="bulkBtn" style="display:none;">🧺 一括アップロード</button>
          <button class="btn btnPrimary" id="newBtn">＋ 新規</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div class="hint" id="resultHint">—</div>
      </div>
      <div class="tableWrap">
        <div id="dashboard" style="display:none; padding:10px 14px 14px;"></div>
        <div id="layoutEditor" style="display:none; padding:10px 14px 14px;"></div>
        <table id="table" style="display:none;">
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>

    <section class="card detail">
      <div class="detailHeader">
        <div class="detailTitle">
          <div class="h" id="detailHead">未選択</div>
          <div class="d" id="detailMeta">左の一覧から選択</div>
        </div>
        <span class="pill" id="editState">VIEW</span>
      </div>
      <div class="detailBody" id="detailBody"></div>
      <div class="detailActions">
        <button class="btn" id="editBtn">✏️ 編集</button>
        <button class="btn btnPrimary" id="saveBtn" disabled>💾 保存</button>
        <button class="btn" id="cancelBtn" disabled>↩️ 取消</button>
        <button class="btn" id="publishBtn" disabled title="確定版として店舗に公開（公開後の変更検知に使う）">📣 店舗へ公開</button>
        <button class="btn btnDanger" id="deleteBtn" disabled>🗑️ 削除</button>
      </div>
    </section>
  </div>

  <!-- Modal -->
  <div class="modalBack" id="modalBack">
    <div class="modal">
      <div class="modalHead">
        <div class="h" id="modalTitle">—</div>
        <button class="btn" id="modalClose">✖</button>
      </div>
      <div class="modalBody">
        <div class="hint" id="modalHint">—</div>
        <textarea id="modalTextarea" spellcheck="false"></textarea>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
          <button class="btn" id="modalSecondary">—</button>
          <button class="btn btnPrimary" id="modalPrimary">—</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const STORAGE_KEY = "promo_hub_mock_v3";
  const THEME_KEY = "promo_hub_theme";
  const USER_KEY = "promo_hub_user";
  const LOG_KEY = "promo_hub_audit_v3";

  const VIEWS = {
    plans:{icon:"🗓️",name:"施策計画（チラシ/クーポン）",desc:"営業企画：いつ/どの版/どの店/枠数/締切/確定。公開後の変更検知も。",columns:["promo_id","kind","campaign","edition","issue_date","store_set","slots","fill","deadline","risk","published","owner","status","updated_at"]},
    items:{icon:"🧾",name:"商品明細（BY入力）",desc:"BY：JAN/商品名/売価/枠/提出状況。Excelから一括貼り付け対応。",columns:["promo_id","dept","buyer","jan","product","price","slot","item_status","updated_at"]},
    layout:{icon:"🧩",name:"紙面レイアウト（枠編集）",desc:"チラシごとの枠（位置/サイズ）をオーバーレイ編集。枠IDを商品明細のslotと一致させると、埋まり/変更が見える。",columns:[]},
    store:{icon:"🏬",name:"店舗ビュー",desc:"店：自店の「いつどのチラシに何が載るか」。公開後に変わったら検知。",columns:["issue_date","promo_id","campaign","edition","kind","status","fill","deadline","changed"]},
    dash:{icon:"📊",name:"進捗ダッシュボード",desc:"埋まり率×締切リスクを俯瞰（今日時点）。",columns:[]},
    history:{icon:"🕘",name:"変更履歴（監査ログ）",desc:"作成/更新/削除/一括取込のログ。発注ミス防止の必須部品。",columns:["ts","actor","entity","action","summary"]}
  };

  const MASTER = {
    kinds:["チラシ","クーポン","アプリ施策"],
    plan_status:["企画中","カンプ作成中","BY入力中","確定","入稿/印刷"],
    item_status:["下書き","提出済","承認","差戻し"],
    owners:["営業企画A","営業企画B","営業企画C"],
    depts:["グロサリー","日配","畜産","水産","青果","惣菜","ベーカリー","非食品"],
    buyers:["BY_佐々木","BY_成田","BY_久保田","BY_野々下","BY_山田","BY_鈴木"],
    store_sets:["全店","道央A","道央B","道東A","都市型","郊外型","特定10店"],
    stores:[
      {store_id:"S001",name:"札幌桑園",set:"都市型"},
      {store_id:"S002",name:"札幌西岡",set:"郊外型"},
      {store_id:"S003",name:"滝川",set:"道央A"},
      {store_id:"S004",name:"厚岸",set:"道東A"},
      {store_id:"S005",name:"釧路昭和",set:"道東A"},
      {store_id:"S006",name:"帯広",set:"道東A"},
      {store_id:"S007",name:"北見",set:"道東A"},
      {store_id:"S008",name:"室蘭",set:"道央B"},
      {store_id:"S009",name:"旭川駅前",set:"道央A"},
    ]
  };

  const $ = (sel)=>document.querySelector(sel);
  const el = (tag, attrs={}, kids=[])=>{
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)){
      if (k==="class") n.className=v;
      else if (k==="text") n.textContent=v;
      else if (k==="html") n.innerHTML=v;
      else if (k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k,v);
    }
    for (const c of kids) n.appendChild(typeof c==="string"?document.createTextNode(c):c);
    return n;
  };
  const deep = (x)=>JSON.parse(JSON.stringify(x));
  const nowISO = ()=>new Date().toISOString();
  const todayYMD = ()=>{
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const shortDT = (iso)=>{
    if(!iso) return "";
    const d=new Date(iso); if(Number.isNaN(d.getTime())) return iso;
    return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  };
  const daysDiff = (ymd)=>{
    if(!ymd) return null;
    const [Y,M,D]=ymd.split("-").map(Number);
    const t=new Date(Y,(M||1)-1,D||1);
    const n=new Date();
    const a=new Date(n.getFullYear(),n.getMonth(),n.getDate());
    const b=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    return Math.round((b-a)/(1000*60*60*24));
  };
  const uid = ()=>"PR"+Math.random().toString(16).slice(2,8).toUpperCase();
  const iid = ()=>"IT"+Math.random().toString(16).slice(2,10).toUpperCase();
  const eid = ()=>"EV"+Math.random().toString(16).slice(2,10).toUpperCase();

  const badge = (text, kind)=>el("span",{class:`badge ${kind||"warn"}`,text});
  const progressBar = (rate)=>{
    const outer=el("div",{class:"progress"},[el("div",{})]);
    outer.firstChild.style.width = (Math.max(0,Math.min(1,rate||0))*100).toFixed(0)+"%";
    return outer;
  };

  function getUser(){
    return ($("#userName").value||localStorage.getItem(USER_KEY)||"local_user").trim() || "local_user";
  }
  function setUser(v){
    localStorage.setItem(USER_KEY, v);
  }

  // ===== Audit Log =====
  let audit = loadAudit();
  function loadAudit(){
    const raw=localStorage.getItem(LOG_KEY);
    if(!raw) return [];
    try{

  function summarizeDiff(before, after){
    if(!before) return "create";
    const keys = Object.keys(after||{});
    const changed=[];
    keys.forEach(k=>{
      if(JSON.stringify(before[k])!==JSON.stringify(after[k])) changed.push(k);
    });
    if(!changed.length) return "no-change";
    const core = changed.slice(0,8).join(", ");
    return changed.length>8 ? `${core} …（計${changed.length}項目）` : core;
  }

  function calcFill(promo_id){
    const plan=all.plans.find(p=>p.promo_id===promo_id);
    const slots=Number(plan?.slots||0);
    const its=all.items.filter(it=>it.promo_id===promo_id);
    const count_all=its.length;
    const count_submitted=its.filter(it=>it.item_status==="提出済"||it.item_status==="承認").length;
    const count_approved=its.filter(it=>it.item_status==="承認").length;
    return {
      slots, count_all, count_submitted, count_approved,
      rate_all: slots?count_all/slots:0,
      rate_submitted: slots?count_submitted/slots:0,
      rate_approved: slots?count_approved/slots:0,
    };
  }

  function riskBadge(plan){
    const d=daysDiff(plan.buyer_deadline);
    const fill=calcFill(plan.promo_id).rate_submitted;
    if(d!==null && d<0) return badge("締切超過","danger");
    if(fill>=1) return badge("OK","ok");
    if(d!==null && d<=2) return badge(`残${d}日`,"danger");
    if(d!==null && d<=7) return badge(`残${d}日`,"warn");
    return badge(d!==null?`残${d}日`:"—","warn");
  }

  function storeMatchesPlan(store, plan){
    if(plan.store_set==="特定10店") return (plan.store_ids||[]).includes(store.store_id);
    if(!plan.store_set) return false;
    if(plan.store_set==="全店") return true;
    return plan.store_set===store.set || plan.store_set==="都市型"&&store.set==="都市型" || plan.store_set==="郊外型"&&store.set==="郊外型";
  }

  function changedAfterPublish(plan){
    if(!plan?.published_at) return false;
    const pub=new Date(plan.published_at).getTime();
    if(!Number.isFinite(pub)) return false;
    const latest = all.items
      .filter(it=>it.promo_id===plan.promo_id)
      .reduce((mx,it)=>Math.max(mx, new Date(it.updated_at||0).getTime()), 0);
    return latest > pub;
  }

  function filterPlans(){
    let rows=all.plans.slice();
    const q=qtext();
    const kind=$("#f_kind")?.value||"__all";
    const status=$("#f_status")?.value||"__all";
    const owner=$("#f_owner")?.value||"__all";
    const set=$("#f_store_set")?.value||"__all";
    const sort=$("#f_sort")?.value||"更新日（新→旧）";

    rows=rows.filter(p=>{
      if(kind!=="__all"&&p.kind!==kind) return false;
      if(status!=="__all"&&p.status!==status) return false;
      if(owner!=="__all"&&p.owner!==owner) return false;
      if(set!=="__all"&&p.store_set!==set) return false;
      if(!q) return true;
      const hay=[p.promo_id,p.kind,p.campaign,p.edition,p.issue_date,p.store_set,p.owner,p.status,p.note].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });

    rows.sort((a,b)=>{
      const fillA=calcFill(a.promo_id).rate_submitted;
      const fillB=calcFill(b.promo_id).rate_submitted;
      const da=daysDiff(a.buyer_deadline);
      const db=daysDiff(b.buyer_deadline);
      const cmpDate=(x,y)=>(new Date(x||0)).getTime()-(new Date(y||0)).getTime();
      switch(sort){
        case "更新日（旧→新）": return cmpDate(a.updated_at,b.updated_at);
        case "発行日（近→遠）": return cmpDate(a.issue_date,b.issue_date);
        case "発行日（遠→近）": return cmpDate(b.issue_date,a.issue_date);
        case "埋まり率（高→低）": return fillB-fillA;
        case "締切（近→遠）": return (da??9999)-(db??9999);
        default: return cmpDate(b.updated_at,a.updated_at);
      }
    });
    return rows;
  }

      if(dept!=="__all"&&it.dept!==dept) return false;
      if(buyer!=="__all"&&it.buyer!==buyer) return false;
      if(st!=="__all"&&it.item_status!==st) return false;
      if(!q) return true;
      const plan=all.plans.find(p=>p.promo_id===it.promo_id);
      const hay=[it.item_id,it.promo_id,plan?.campaign,plan?.edition,plan?.kind,it.dept,it.buyer,it.jan,it.product,it.slot,it.item_status,it.note].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });

    rows.sort((a,b)=>{
      const cmpDate=(x,y)=>(new Date(x||0)).getTime()-(new Date(y||0)).getTime();
      switch(sort){
        case "更新日（旧→新）": return cmpDate(a.updated_at,b.updated_at);
        case "売価（高→低）": return Number(b.price||0)-Number(a.price||0);
        case "売価（低→高）": return Number(a.price||0)-Number(b.price||0);
        default: return cmpDate(b.updated_at,a.updated_at);
      }
    });
    return rows;
  }

    rows=rows.filter(p=>{
      if(!q) return true;
      const hay=[p.promo_id,p.kind,p.campaign,p.edition,p.issue_date,p.status,p.owner,p.store_set].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
    rows.sort((a,b)=>{
      const cmpDate=(x,y)=>(new Date(x||0)).getTime()-(new Date(y||0)).getTime();
      const da=daysDiff(a.buyer_deadline), db=daysDiff(b.buyer_deadline);
      switch(sort){
        case "発行日（遠→近）": return cmpDate(b.issue_date,a.issue_date);
        case "締切（近→遠）": return (da??9999)-(db??9999);
        default: return cmpDate(a.issue_date,b.issue_date);
      }
    });
    return rows;
  }

  function filterDash(){
    let rows=all.plans.slice();
    const q=qtext();
    const scope=$("#f_scope")?.value||"すべて";
    const sort=$("#f_sort")?.value||"締切（近→遠）";

    rows=rows.filter(p=>{
      if(!q) return true;
      const hay=[p.promo_id,p.kind,p.campaign,p.edition,p.issue_date,p.status,p.owner,p.store_set].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });

    rows=rows.filter(p=>{
      const d=daysDiff(p.buyer_deadline);
      const fill=calcFill(p.promo_id).rate_submitted;
      if(scope==="締切7日以内") return d!==null && d>=0 && d<=7;
      if(scope==="締切超過") return d!==null && d<0;
      if(scope==="埋まり率80%未満") return fill<0.8;
      return true;
    });

    rows.sort((a,b)=>{
      const da=daysDiff(a.buyer_deadline), db=daysDiff(b.buyer_deadline);
      const fa=calcFill(a.promo_id).rate_submitted, fb=calcFill(b.promo_id).rate_submitted;
      const cmpDate=(x,y)=>(new Date(x||0)).getTime()-(new Date(y||0)).getTime();
      switch(sort){
        case "埋まり率（低→高）": return fa-fb;
        case "更新日（新→旧）": return cmpDate(b.updated_at,a.updated_at);
        default: return (da??9999)-(db??9999);
      }
    });
    return rows;
  }

  function filterHistory(){
    let rows=audit.slice();
    const q=qtext();
    const entity=$("#f_entity")?.value||"すべて";
    const sort=$("#f_sort")?.value||"新しい順";
    rows=rows.filter(e=>{
      if(entity==="plan") return e.entity==="plan";
      if(entity==="item") return e.entity==="item";
      if(entity==="bulk") return e.entity==="bulk";
      return true;
    });
    rows=rows.filter(e=>{
      if(!q) return true;
      const hay=[e.ts,e.actor,e.entity,e.action,e.summary,e.entity_id,e.promo_id].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
    rows.sort((a,b)=>{
      const ta=new Date(a.ts||0).getTime();
      const tb=new Date(b.ts||0).getTime();
      return sort==="古い順" ? (ta-tb) : (tb-ta);
    });
    return rows;
  }

  function layoutId(promo_id, page){ return `LAY-${promo_id}-p${page}`; }

  function ensureLayout(promo_id, page){
    if(!promo_id) return null;
    const pageNo = page||1;
    let lay = all.layouts.find(x=>x.promo_id===promo_id && Number(x.page)===Number(pageNo));
    if(!lay){
      lay = {layout_id:layoutId(promo_id,pageNo), promo_id, page:pageNo, bg:null, bg_w:0, bg_h:0, slots:[], updated_at:nowISO(), updated_by:getUser()};
      all.layouts.push(lay);
      saveAll();
      logEvent({entity:"layout", entity_id:lay.layout_id, action:"create", promo_id, summary:`layout create (page ${pageNo})`});
    }
    if(!Array.isArray(lay.slots)) lay.slots=[];
    return lay;
  }

  function nextSlotId(promo_id){
    const used = new Set();
    all.layouts.filter(l=>l.promo_id===promo_id).forEach(l=>{
      (l.slots||[]).forEach(s=>used.add(s.slot_id));
    });
    for(let i=1;i<=99;i++){
      const id = "S"+String(i).padStart(2,"0");
      if(!used.has(id)) return id;
    }
    return "S99";
  }

    return all.items.filter(i=>i.promo_id===promo_id && String(i.slot||"").trim()===String(slot_id)).length;

  function getRelPos(ev){
    const stage=$("#layoutStage");
    const r=stage.getBoundingClientRect();
    const x=(ev.clientX - r.left)/r.width;
    const y=(ev.clientY - r.top)/r.height;
    return {x,y};
  }

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

function applySlotEl(el, s){
    if(!el || !el.isConnected || !s) return;
    el.style.left = (s.x*100).toFixed(3)+"%";
    el.style.top  = (s.y*100).toFixed(3)+"%";
    el.style.width=(s.w*100).toFixed(3)+"%";
    el.style.height=(s.h*100).toFixed(3)+"%";
  }

  function markSelectedSlotEl(currentEl){
    document.querySelectorAll(".slot.selected").forEach(e=>e.classList.remove("selected"));
    if(currentEl) currentEl.classList.add("selected");
  }

  function onSlotPointerDown(ev, slot_id){
    const promo_id=selectedKey;
    const page=layoutState.page||1;
    const lay=ensureLayout(promo_id,page);
    const s=lay?.slots?.find(x=>x.slot_id===slot_id);
    if(!s) return;

    // detect resize handle (if any)
    const handleEl = (ev.target && ev.target.closest) ? ev.target.closest(".handle") : null;
    const handle = handleEl ? handleEl.getAttribute("data-handle") : null;

    if(s.locked){
      ev.preventDefault();
      selectedSlotId = slot_id;
      markSelectedSlotEl(ev.currentTarget);
      renderDetail();
      return;
    }

    selectedSlotId = slot_id;
    markSelectedSlotEl(ev.currentTarget);
    renderDetail();

    ev.preventDefault();
    ev.stopPropagation();

    const start = getRelPos(ev);
    const el = ev.currentTarget;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}

    dragSession = {
      promo_id, page, layout_id: lay.layout_id,
      slot_id,
      mode: handle ? "resize" : "move",
      handle: handle || null,
      start,
      orig: {...s},
      el,
      pointerId: ev.pointerId,
      moved:false
    };
    window.addEventListener("pointermove", onSlotPointerMove);
    window.addEventListener("pointerup", onSlotPointerUp, {once:true});
    window.addEventListener("pointercancel", onSlotPointerUp, {once:true});
  }

  function onSlotPointerMove(ev){
    if(!dragSession) return;
    const {promo_id,page,slot_id,mode,handle,start,orig}=dragSession;
    const lay=ensureLayout(promo_id,page);
    const s=lay.slots.find(x=>x.slot_id===slot_id);
    if(!s) return;

    const cur=getRelPos(ev);
    const dx=cur.x-start.x;
    const dy=cur.y-start.y;

    if(mode==="move"){
      s.x = clamp01(orig.x + dx);
      s.y = clamp01(orig.y + dy);
      s.x = Math.min(s.x, 1 - s.w);
      s.y = Math.min(s.y, 1 - s.h);
    } else {
      let x=orig.x, y=orig.y, w=orig.w, h=orig.h;
      const min=0.02;
      if(handle==="se"){
        w = Math.max(min, orig.w + dx);
        h = Math.max(min, orig.h + dy);
      } else if(handle==="sw"){
        w = Math.max(min, orig.w - dx);
        h = Math.max(min, orig.h + dy);
        x = orig.x + dx;
      } else if(handle==="ne"){
        w = Math.max(min, orig.w + dx);
        h = Math.max(min, orig.h - dy);
        y = orig.y + dy;
      } else if(handle==="nw"){
        w = Math.max(min, orig.w - dx);
        h = Math.max(min, orig.h - dy);
        x = orig.x + dx;
        y = orig.y + dy;
      }
      x = clamp01(x); y = clamp01(y);
      w = Math.min(w, 1 - x);
      h = Math.min(h, 1 - y);
      s.x=x; s.y=y; s.w=w; s.h=h;
    }
    s.updated_at=nowISO(); s.updated_by=getUser();
    lay.updated_at=nowISO(); lay.updated_by=getUser();

    // update DOM only (fast); full rerender on pointerup
    if(Math.abs(dx) + Math.abs(dy) > 0.002) dragSession.moved = true;
    applySlotEl(dragSession.el, s);
  }

  function onSlotPointerUp(ev){
    window.removeEventListener("pointermove", onSlotPointerMove);
    if(!dragSession) return;

    const session = dragSession;
    dragSession = null;

    const {promo_id,page,slot_id,mode,orig,layout_id,el,pointerId,moved} = session;
    try{ el && el.releasePointerCapture && el.releasePointerCapture(pointerId); }catch(e){}

    const lay = ensureLayout(promo_id,page);
    const s = lay?.slots?.find(x=>x.slot_id===slot_id);
    if(!s){ renderMain(); renderDetail(); return; }

    saveAll();
    const summary = mode==="move" ? `slot move ${slot_id}` : `slot resize ${slot_id}`;
    logEvent({entity:"layout", entity_id:layout_id, action:"update", promo_id, summary, meta:{slot_id, before:orig, after:s}});
    if(moved) layoutState._justDragged = Date.now();

    // refresh once (counts/selection/inputs)
    renderMain(); renderDetail();
  }

  async function setLayoutBackgroundFromFile(file){
    if(!file) return;
    const dataUrl = await new Promise((resolve,reject)=>{
      const fr=new FileReader();
      fr.onload=()=>resolve(fr.result);
      fr.onerror=reject;
      fr.readAsDataURL(file);
    });

    const img = new Image();
    await new Promise((resolve,reject)=>{
      img.onload=resolve; img.onerror=reject; img.src=dataUrl;
    });

    const maxSide=1600;
    let w=img.naturalWidth, h=img.naturalHeight;
    let scale=Math.min(1, maxSide/Math.max(w,h));
    const cw=Math.round(w*scale), ch=Math.round(h*scale);
    const canvas=document.createElement("canvas");
    canvas.width=cw; canvas.height=ch;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,cw,ch);
    const jpeg = canvas.toDataURL("image/jpeg", 0.82);

    const promo_id=selectedKey;
    const page=layoutState.page||1;
    const lay=ensureLayout(promo_id,page);
    lay.bg=jpeg; lay.bg_w=cw; lay.bg_h=ch;
    lay.updated_at=nowISO(); lay.updated_by=getUser();
    saveAll();
    logEvent({entity:"layout", entity_id:lay.layout_id, action:"update", promo_id, summary:"background set"});
    renderMain(); renderDetail();
  }

  function parseDelimited(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
    if(!lines.length) return {header:[], rows:[]};
    // detect delimiter: tab > comma > semicolon
    const sample=lines.slice(0,5).join("\n");
    const tab=(sample.match(/\t/g)||[]).length;
    const comma=(sample.match(/,/g)||[]).length;
    const semi=(sample.match(/;/g)||[]).length;
    const delim = tab>=comma && tab>=semi ? "\t" : (comma>=semi ? "," : ";");
    const split = (line)=>{
      // simple CSV split (handles quoted commas minimally)
      const out=[]; let cur=""; let q=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){ q=!q; continue; }
        if(!q && ch===delim){ out.push(cur); cur=""; continue; }
        cur+=ch;
      }
      out.push(cur);
      return out.map(x=>x.trim());
    };
    const header=split(lines[0]).map(h=>h.replace(/^\uFEFF/,"").trim());
    const rows=lines.slice(1).map(l=>split(l));
    return {delim, header, rows};
  }

  function bulkUpsert(text, close){
    const parsed=parseDelimited(text);
    if(!parsed.header.length){ alert("貼り付け内容が空です。"); return; }
    const h=parsed.header.map(x=>x.toLowerCase());
    const idx = (name)=>h.indexOf(name.toLowerCase());
    const need = ["promo_id","dept","buyer","jan","product","price","item_status"].filter(k=>idx(k)<0);
    if(need.length){
      alert("必須ヘッダが不足：\n- "+need.join("\n- ")+"\n\n例：promo_id, dept, buyer, jan, product, price, item_status");
      return;
    }

    const t=nowISO();
    let created=0, updated=0, skipped=0;
    const changes=[];

    parsed.rows.forEach((row, rIdx)=>{
      const get=(k)=>row[idx(k)] ?? "";
      const promo_id=(get("promo_id")||"").trim();
      const jan=(get("jan")||"").replace(/\D/g,"").slice(0,13);
      const dept=(get("dept")||"").trim();
      const buyer=(get("buyer")||"").trim();
      const product=(get("product")||"").trim();
      const price=Number((get("price")||"").toString().replace(/[^0-9.]/g,""));
      const regular_price=Number((get("regular_price")||"").toString().replace(/[^0-9.]/g,"")) || 0;
      const slot=(get("slot")||"").trim();
      const item_status=(get("item_status")||"下書き").trim();
      const note=(get("note")||"").trim();
      const item_id_raw = (idx("item_id")>=0 ? (get("item_id")||"").trim() : "");

      if(!promo_id || !jan || !dept || !buyer || !product || !Number.isFinite(price)){
        skipped++;
        return;
      }
      if(!all.plans.some(p=>p.promo_id===promo_id)){
        skipped++;
        return;
      }

      let target=null, before=null, action="create";
      if(item_id_raw){
        target = all.items.find(it=>it.item_id===item_id_raw) || null;
      }
      if(!target){
        target = all.items.find(it=>it.promo_id===promo_id && String(it.jan||"")===jan) || null;
      }
      if(target){
        before=deep(target);
        action="update";
        target.dept=dept; target.buyer=buyer; target.jan=jan; target.product=product;
        target.price=price; target.regular_price=regular_price; target.slot=slot;
        target.item_status=item_status; target.note=note; target.updated_at=t;
        updated++;
        changes.push({item_id:target.item_id, jan, action, diff:summarizeDiff(before,target)});
        logEvent({entity:"item", entity_id:target.item_id, promo_id, action:"update", summary:`bulk: ${summarizeDiff(before,target)}`});
      }else{
        const obj={item_id:iid(), promo_id, dept, buyer, jan, product, price, regular_price, slot, item_status, note, created_at:t, updated_at:t};
        all.items.unshift(obj);
        created++;
        changes.push({item_id:obj.item_id, jan, action:"create", diff:"create"});
        logEvent({entity:"item", entity_id:obj.item_id, promo_id, action:"create", summary:"bulk: create"});
      }
      const p=all.plans.find(p=>p.promo_id===promo_id);
      if(p) p.updated_at=t;
    });

    saveAll();
    logEvent({
      entity:"bulk", entity_id:"bulk_upsert", promo_id:null, action:"upsert",
      summary:`bulk_upsert created=${created}, updated=${updated}, skipped=${skipped}`,
      meta:{created, updated, skipped, sample:changes.slice(0,20)}
    });

    close();
    renderAll();
    alert(`一括取込 完了\ncreated=${created}\nupdated=${updated}\nskipped=${skipped}\n\n※詳細は「変更履歴」ビューで確認できます`);
  }

      (text, close)=>{

          if(!obj?.data) throw new Error("data missing");
          const d=obj.data;
          if(!Array.isArray(d.plans)||!Array.isArray(d.items)) throw new Error("shape invalid");
          const layouts = Array.isArray(d.layouts)?d.layouts:[];
          all={plans:d.plans, items:d.items, layouts};
          audit = Array.isArray(obj.audit)?obj.audit:[];
          saveAll(); saveAudit();
          selectedKey=null; editMode=false; draft=null;
          close(); renderAll(); alert("取り込みました。");
        }catch(e){ alert("JSONの形式が不正です。"); }
      },
      (text, close)=>close()
    );
  }

  function resetAll(){
    if(!confirm("ダミーデータへ初期化します。現在のデータは消えます。よろしいですか？")) return;
    all=seedDummy(); saveAll();
    audit=[]; saveAudit();
    selectedKey=null; editMode=false; draft=null;
    renderAll();
  }

  function renderMain(){
    if(currentViewKey==="dash"){ renderDashboard(); renderDetail(); return; }
    if(currentViewKey==="layout"){ renderLayout(); renderDetail(); return; }
    renderTable(); renderDetail();
  }
  function renderAll(){
    renderNav(); renderHeader(); renderFilters(); renderMain();

    // top buttons visibility
    $("#newBtn").style.display = (currentViewKey==="dash" || currentViewKey==="history" || currentViewKey==="layout") ? "none" : "";
    $("#newBtn").disabled = (currentViewKey==="store");
    $("#bulkBtn").style.display = (currentViewKey==="items") ? "" : "none";
  }

  // Bind
  function bind(){
    $("#toggleTheme").addEventListener("click", toggleTheme);
    $("#searchInput").addEventListener("input", ()=>renderMain());
    $("#newBtn").addEventListener("click", createNew);

    $("#bulkBtn").addEventListener("click", openBulkModal);

    $("#editBtn").addEventListener("click", startEdit);
    $("#saveBtn").addEventListener("click", trySave);
    $("#cancelBtn").addEventListener("click", cancelEdit);
    $("#deleteBtn").addEventListener("click", deleteSelected);
    $("#publishBtn").addEventListener("click", publishPlan);

    $("#exportBtn").addEventListener("click", exportJSON);
    $("#importBtn").addEventListener("click", importJSON);
    $("#resetBtn").addEventListener("click", resetAll);
    $("#layoutBgInput").addEventListener("change",(e)=>{ const f=e.target.files?.[0]; if(f) setLayoutBackgroundFromFile(f); });

    $("#modalBack").addEventListener("click",(e)=>{ if(e.target===$("#modalBack")) $("#modalBack").classList.remove("show"); });

    $("#userName").addEventListener("input", (e)=>setUser(e.target.value));

    document.addEventListener("keydown",(e)=>{
      if(e.key==="Escape"){
        if($("#modalBack").classList.contains("show")) $("#modalBack").classList.remove("show");
        if(editMode) cancelEdit();
      }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); trySave(); }
    });
  }

  // Init
  loadTheme();
  const savedUser=localStorage.getItem(USER_KEY)||"";
  $("#userName").value=savedUser;
  bind();
  renderAll();
})();
</script>

  <input id="layoutBgInput" type="file" accept="image/*" style="display:none" />
</body>
</html>
